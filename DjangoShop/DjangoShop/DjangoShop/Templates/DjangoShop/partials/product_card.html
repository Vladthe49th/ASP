{% load static %}

<div class="card">
    <img src="{% static product.image %}" alt="{{ product.name }}">

    <h2>{{ product.name }}</h2>

    <p>{{ product.description }}</p>

    <p>
        <strong>Category:</strong>
        {{ product.category }}
    </p>

    <p class="price">
        {{ product.price }} грн
    </p>
</div>

<style>
    .card {
        background-color: white;
        border-radius: 10px;
        padding: 15px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        text-align: center;
    }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }

    .price {
        color: green;
        font-size: 20px;
        font-weight: bold;
    }
</style>
