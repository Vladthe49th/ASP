{% extends 'main/base.html' %}

{% block content %}
<h1>Каталог</h1>

{% for product in products %}
<div class="card">
    {% if product.image %}
    <img src="{{ product.image.url }}" width="250">
    {% endif %}
    <h2>{{ product.name }}</h2>
    <p>{{ product.description }}</p>
    <p>Ціна: {{ product.price }} грн</p>
</div>
{% endfor %}

{% endblock %}
